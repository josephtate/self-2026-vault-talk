---
# Traefik values — DaemonSet with hostPort 80/443, matching platform-k8s pattern.
# Access via: $(minikube ip) with hello.vault-talk.lan in /etc/hosts (make add-hosts)
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-values
  namespace: flux-system
data:
  values.yaml: |-
    deployment:
      kind: DaemonSet

    service:
      type: ClusterIP

    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443

    globalArguments: null

    additionalArguments:
      - --log.level=INFO
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  releaseName: ${NAMESPACE_PREFIX}-traefik
  targetNamespace: ${NAMESPACE_PREFIX}-traefik
  chart:
    spec:
      chart: traefik
      version: "32.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
