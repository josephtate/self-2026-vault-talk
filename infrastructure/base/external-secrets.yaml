---
# Namespace for ESO. Created here so Flux can adopt the Helm release that bootstrap.sh installed.
# bootstrap.sh installs ESO first (prerequisite for secret sync), then Flux takes over management.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-system
---
# ServiceAccount used by ESO to authenticate with Vault (Kubernetes auth method)
# Also created by bootstrap.sh; Flux ensures it exists and stays in sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
# ADOPTED BY FLUX: bootstrap.sh installs this release first so it can sync secrets.
# Flux adopts it here for ongoing version management via GitOps.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 15m
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: "0.19.2"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    createNamespace: false
  targetNamespace: external-secrets-system
  values:
    installCRDs: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
