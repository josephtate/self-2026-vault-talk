---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helmresources
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: jtate-vault-talk
  path: "./helmresources"
  prune: true
  wait: true
  timeout: 3m
  retryInterval: 30s
  dependsOn:
    - name: infrastructure
  postBuild:
    substitute:
      NAMESPACE_PREFIX: "dev"
      VAULT_URL: "http://dev-vault.dev-vault.svc.cluster.local:8200"
