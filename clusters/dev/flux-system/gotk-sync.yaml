---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: jtate-vault-talk
  namespace: flux-system
spec:
  interval: 30s
  ref:
    branch: ${GITHUB_BRANCH}
  secretRef:
    name: flux-system
  timeout: 60s
  url: https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}.git
---
# Root Kustomization: watches clusters/dev and fans out to infrastructure/helmresources/apps
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./clusters/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: jtate-vault-talk
  postBuild:
    substitute:
      ENVIRONMENT: "dev"
      NAMESPACE_PREFIX: "dev"
      CLUSTER_NAME: "vault-talk"
      DOMAIN: "vault-talk.lan"
      VAULT_URL: "http://dev-vault.dev-vault.svc.cluster.local:8200"
