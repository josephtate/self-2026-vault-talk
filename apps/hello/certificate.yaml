---
# cert-manager issues this certificate from Vault PKI (ClusterIssuer vault-issuer-dev).
# 60-day duration, auto-renewed at 30 days remaining — no manual rotation needed.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello-cert-${NAMESPACE_PREFIX}
  namespace: ${NAMESPACE_PREFIX}-hello
spec:
  secretName: hello-tls
  issuerRef:
    name: vault-issuer-${NAMESPACE_PREFIX}
    kind: ClusterIssuer
  duration: 1440h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 384
  dnsNames:
    - hello.${DOMAIN}
