---
# Pulls secret/kubernetes/hello/config from Vault and creates K8s Secret hello-message.
# 30s refresh for live demo: update in Vault, watch it sync within half a minute.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-externalsecret
  namespace: ${NAMESPACE_PREFIX}-hello
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hello-message
    creationPolicy: Owner
  data:
    - secretKey: message
      remoteRef:
        key: hello/config
        property: message
